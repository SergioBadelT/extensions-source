name: Build lectormonline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build only lectormonline
        run: |
          chmod +x gradlew
          ./gradlew :src:es:lectormonline:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lectormonline-apk
          path: src/es/lectormonline/build/outputs/apk/release/*.apk
          if-no-files-found: error
